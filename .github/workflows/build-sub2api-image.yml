name: Build Sub2API Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - codex/sub2api-v0.1.134-pushable
    paths:
      - Dockerfile
      - backend/**
      - frontend/**
      - deploy/docker-entrypoint.sh
      - .github/workflows/build-sub2api-image.yml

permissions:
  contents: write

concurrency:
  group: sub2api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          no-cache: true
          tags: sub2api:github-${{ github.run_number }}
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
            COMMIT=${{ github.sha }}

      - name: Save image archive
        run: |
          docker save sub2api:github-${{ github.run_number }} | gzip > sub2api-github-${{ github.run_number }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-image-${{ github.run_number }}
          path: sub2api-github-${{ github.run_number }}.tar.gz
          retention-days: 3

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sub2api-github-${{ github.run_number }}" \
            "sub2api-github-${{ github.run_number }}.tar.gz" \
            --title "Sub2API Docker image ${{ github.run_number }}" \
            --notes "Docker image archive built from commit ${{ github.sha }}." \
            --latest=false
